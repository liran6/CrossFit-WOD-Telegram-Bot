name: Schedule WOD releaser

on:
  schedule:
    # Run at 3 AM UTC every day
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger of the workflow

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Added google-genai for Gemini and urllib3 (usually comes with requests)
          pip install requests beautifulsoup4 google-genai

      - name: Run WOD Fetcher
        env:
          # Match the environment variable names used in your Python script
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Ensure this filename matches your script name (e.g., main.py or daily_wod_sender.py)
          python main.py




